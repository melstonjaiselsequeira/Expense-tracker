<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ExpenseFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Early Theme Initialization to match user preference -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('expenseflow_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" title="Back to ExpenseFlow Home" style="text-decoration: none; display: inline-block;">
                    <div class="logo-icon"><img src="/static/img/logo.png" alt="ExpenseFlow Logo" class="app-logo-img"></div>
                </a>
                <h1>Welcome Back</h1>
                <p>Log in to access your expenses and insights</p>
            </div>

            <div id="auth-alert" class="auth-alert"{% if verified or error %} style="display: block;" class="auth-alert {% if verified %}success{% else %}error{% endif %}"{% endif %}>
                {% if verified %}
                <div><i class="fas fa-check-circle"></i> Email verified successfully! Please log in to access your dashboard.</div>
                {% elif error %}
                <div><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
                {% endif %}
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Show or hide password">
                            <i class="fas fa-eye" id="password-eye-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </button>
            </form>

            <div class="auth-footer">
                <div>Don't have an account? <a href="/register">Create an account</a></div>
                <div><a href="#" id="forgot-link">Forgot your password?</a></div>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('auth-alert');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('btn-toggle-password');
        const eyeIcon = document.getElementById('password-eye-icon');

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        }

        function showAlert(msg, type, showSignupBtn = false) {
            alertBox.className = `auth-alert ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            if (showSignupBtn) {
                alertBox.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div><i class="fas ${icon}"></i> ${msg}</div>
                        <div>
                            <a href="/register" class="btn-signup-alert" style="display: inline-block; padding: 6px 14px; background: var(--gradient); color: #fff; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius-sm); text-decoration: none; text-align: center;">
                                <i class="fas fa-user-plus"></i> Sign Up
                            </a>
                        </div>
                    </div>
                `;
            } else {
                alertBox.innerHTML = `<div><i class="fas ${icon}"></i> ${msg}</div>`;
            }
            alertBox.style.display = 'block';
        }

        // Check for verification redirect
        document.addEventListener('DOMContentLoaded', () => {
            try { sessionStorage.removeItem('loginNotice'); } catch (e) {}
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('verified') === 'true') {
                showAlert('Email verified successfully! Please log in to access your dashboard.', 'success');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            alertBox.style.display = 'none';
            const data = {
                email: e.target.email.value.trim(),
                password: e.target.password.value
            };
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                if (resp.ok) {
                    const successMsg = 'Login successful! Welcome back.';
                    sessionStorage.setItem('pendingToast', JSON.stringify({
                        message: successMsg,
                        type: 'success'
                    }));
                    showAlert(successMsg, 'success');
                    setTimeout(() => window.location.href = '/dashboard', 400);
                } else {
                    if (result.code === 'USER_NOT_FOUND' || (result.error && result.error.includes('Account not found'))) {
                        showAlert('Account not found. Please sign up to continue.', 'error', true);
                    } else if (result.code === 'INVALID_PASSWORD' || (result.error && result.error.includes('Incorrect password'))) {
                        showAlert('Incorrect password. Please try again.', 'error', false);
                    } else {
                        showAlert(result.error || 'Login failed', 'error', false);
                    }
                }
            } catch (err) {
                showAlert('Network error, please try again.', 'error', false);
            }
        });

        document.getElementById('forgot-link').addEventListener('click', async e => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showAlert('Please enter your email above to reset password.', 'error');
                return;
            }
            try {
                const resp = await fetch('/reset-password-request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email})
                });
                const res = await resp.json();
                showAlert(res.message || 'Password reset link sent if account exists.', 'success');
            } catch (err) {
                showAlert('Could not send reset request.', 'error');
            }
        });
    </script>
</body>
</html>
