<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ExpenseFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2.3">
    <!-- Early Theme Initialization to match user preference (defaults to clean light UI) -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('expenseflow_theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" title="Back to ExpenseFlow Home" style="text-decoration: none; display: inline-block;">
                    <div class="logo-icon"><img src="/static/img/logo.png" alt="ExpenseFlow Logo" class="app-logo-img"></div>
                </a>
                <h1>Create Account</h1>
                <p>Start tracking your expenses and mastering your budget</p>
            </div>

            <div id="auth-alert" class="auth-alert"></div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Full Name" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" placeholder="At least 8 chars long" required>
                        <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Show or hide password">
                            <i class="fas fa-eye" id="password-eye-icon"></i>
                        </button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="password-strength" id="password-strength" style="display: none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <div class="strength-text" id="strength-text">Password strength: Weak</div>
                    </div>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>

            <div class="auth-footer">
                <div>Already have an account? <a href="/login">Log in</a></div>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('auth-alert');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('btn-toggle-password');
        const eyeIcon = document.getElementById('password-eye-icon');
        const strengthContainer = document.getElementById('password-strength');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        }

        if (passwordInput && strengthContainer) {
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                if (!val) {
                    strengthContainer.style.display = 'none';
                    return;
                }
                strengthContainer.style.display = 'block';

                let score = 0;
                if (val.length >= 8) score++;
                if (/[0-9]/.test(val)) score++;
                if (/[A-Z]/.test(val)) score++;
                if (/[^A-Za-z0-9]/.test(val)) score++;

                if (score <= 1) {
                    strengthFill.style.width = '25%';
                    strengthFill.style.background = '#ef4444';
                    strengthText.textContent = 'Password strength: Weak';
                    strengthText.style.color = '#ef4444';
                } else if (score === 2) {
                    strengthFill.style.width = '50%';
                    strengthFill.style.background = '#f59e0b';
                    strengthText.textContent = 'Password strength: Fair';
                    strengthText.style.color = '#f59e0b';
                } else if (score === 3) {
                    strengthFill.style.width = '75%';
                    strengthFill.style.background = '#06b6d4';
                    strengthText.textContent = 'Password strength: Good';
                    strengthText.style.color = '#06b6d4';
                } else {
                    strengthFill.style.width = '100%';
                    strengthFill.style.background = '#10b981';
                    strengthText.textContent = 'Password strength: Strong';
                    strengthText.style.color = '#10b981';
                }
            });
        }

        function showAlert(msg, type) {
            alertBox.className = `auth-alert ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            alertBox.innerHTML = `<div><i class="fas ${icon}"></i> ${msg}</div>`;
            alertBox.style.display = 'block';
        }

        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn && submitBtn.disabled) return;
            alertBox.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.6';
            }
            const data = {
                full_name: e.target.full_name.value.trim(),
                email: e.target.email.value.trim(),
                password: e.target.password.value
            };
            try {
                const resp = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                if (resp.ok) {
                    const successMsg = result.message || 'Registration successful! A verification link has been sent to your email. Please verify before logging in.';
                    showAlert(successMsg, 'success');
                    setTimeout(() => window.location.href = '/login', 2500);
                } else {
                    showAlert(result.error || 'Registration failed', 'error');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '';
                    }
                }
            } catch (err) {
                showAlert('Network error, please try again.', 'error');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '';
                }
            }
        });
    </script>
</body>
</html>
